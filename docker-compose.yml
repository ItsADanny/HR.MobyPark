version: '3.8'

services:
  mobypark:
    image: mobypark:latest
    container_name: mobypark-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - mobypark-network

networks:
  mobypark-network:
    driver: bridge
