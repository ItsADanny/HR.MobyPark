              schema:
                $ref: '#/components/schemas/payments'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/common.UnauthorizedInvalidorMissingToken"
    post:
      tags:
        - payments
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payments'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidorMissingToken'
  
  /payments/:
    put:
      tags:
        - payments
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payments'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                oneof: #multiple possible responses for 401
                  - $ref: '#/components/schemas/common.UnauthorizedInvalidormissingToken'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payments.notFound'
  
  /payments/refund:
