openapi: 3.0.1
info:
  title: HR.MobyPark
  description: |-
    This documentation contains the endpoints and there example output for the MobyPark Project API

    Project links:
    - [HR.MobyPark project repository (MAIN)](https://github.com/swagger-api/swagger-petstore)
    - [HR.MobyPark project repository (STABLE)](https://github.com/swagger-api/swagger-petstore)
    - [HR.MobyPark project repository (DEVELOPMENT)](https://github.com/swagger-api/swagger-petstore)
    - [HR.MobyPark project repository (TEMPLATE)](https://github.com/swagger-api/swagger-petstore)
    - [MobyPark project case](https://github.com/ItsADanny/HR.MobyPark/blob/template/Casus%20-%20MobyPark.pdf)
    - [Software Construction: Tools & Processes Course Guide](https://github.com/ItsADanny/HR.MobyPark/blob/template/INFSCP01%20-%202526%20-%20Full-time%20Course%20Manual%20-%20Definitief.pdf)
    
  version: BETA 1.0.0
servers:
  - url: https://localhost:8000/
tags:
  - name: register
    description: All endpoints that are connected to the /register subdomain
  - name: login
    description: All endpoints that are connected to the /login subdomain
  - name: logout
    description: All endpoints that are connected to the /logout subdomain
  - name: profile
    description: All endpoints that are connected to the /profile subdomain
  - name: parking-lots
    description: All endpoints that are connected to the /parking-lots subdomain
  - name: reservations
    description: All endpoints that are connected to the /reservations subdomain
  - name: vehicles
    description: All endpoints that are connected to the /vehicles subdomain
  - name: payments
    description: All endpoints that are connected to the /payments subdomain
  - name: billing
    description: All endpoints that are connected to the /billing subdomain
paths:
  /register:
    post:
      tags:
        - register
      summary: Create a new user account
      description: Create a new user account within the application.
      operationId: do_POST./register
      parameters:
        - name: username
          in: query
          description: The username for the user account
          required: true
          schema:
            type: string
            format: string
        - name: password
          in: query
          description: The unhashed password that has been chosen for the account
          required: true
          schema:
            type: string
            format: string
      requestBody:
        description: Create a new user account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
        required: true
      responses:
        '200':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registerAlreadyExist'
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registerCreated'

  /login:
    post:
      tags:
        - login
      summary: preforms the login sequence for a user account
      description: preforms the login sequence for a user account and returns a session token
      operationId: do_POST./login
      parameters:
        - name: username
          in: query
          description: The username for the user account
          required: true
          schema:
            type: string
            format: string
        - name: password
          in: query
          description: The unhashed password for the account
          required: true
          schema:
            type: string
            format: string
      requestBody:
        description: Create a new user account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user'
        required: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginSuccessful'
        '400':
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginMissingCredentials'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/loginInvalidCredentials'
                  - $ref: '#/components/schemas/loginUserNotFound'

  /logout:
    get:
      tags:
        - logout
      summary: preforms the logout sequence for a user account
      description: preforms the logout sequence for a user account and returns a status code 200 when successful
      operationId: do_GET./logout
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          'description': Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logoutSuccessful'
        '400':
          'description': Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logoutInvalidToken'

  /profile:
    put:
      tags:
        - profile
      summary: Update the users profile
      description: Endpoint for performing a update on the user account profile
      operationId: do_PUT./profile
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: username
          in: query
          description: The username for the user account
          required: true
          schema:
            type: string
            format: string
        - name: password
          in: query
          description: The password for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profileUpdateSuccessful'
        '401':
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'

    get:
      tags:
        - profile
      summary: Retrieve the user profile from the users.json file
      description: Retrieve the user profile from the users.json file
      operationId: do_GET./profile
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: operation successful
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/getProfileJSON_newRegistration'
                  - $ref: '#/components/schemas/getProfileJSON_user'
                  - $ref: '#/components/schemas/getProfileJSON_admin'
        '401':
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'

  /parking-lots:
    post:
      tags:
        - parking-lots
      operationId: do_POST./parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: id
          in: query
          description: ID of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: name
          in: query
          description: Name of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: location
          in: query
          description: Location of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: address
          in: query
          description: Address of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: capacity
          in: query
          description: total capacity of the parking lot (total amount of parking spots)
          required: true
          schema:
            type: integer
            format: int64
        - name: reserved
          in: query
          description: Reserved parking spots in the parking lot
          required: true
          schema:
            type: integer
            format: int64
        - name: tariff
          in: query
          description: Cost of parking in the parking lot
          required: true
          schema:
            type: number
            format: XXX.XX
        - name: daytariff
          in: query
          description: The max cost of parking for a whole day in the parking lot
          required: true
          schema:
            type: number
            format: XXX.XX
        - name: created_at
          in: query
          description: The day the parking lot was created in the system
          required: true
          schema:
            type: string
            format: YYYY-MM-DD
        - name: coordinates
          in: query
          description: Coordinates for the parking lot
          required: true
          schema:
            $ref: '#/components/schemas/coordinates'
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parking-lots.savedSuccessful'
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          description: Access denied, Not a ADMIN account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'

  /parking-lots/:
    get:
      tags:
        - parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.AllLotsDump'

  /parking-lots/{ParkingLotID}:
    get:
      tags:
        - parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: ParkingLotID
          in: path
          description: The parking lot ID for which you want to retrieve the current sessions
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.SpecificLotDump'
        '404':
          description: Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.LotNotFound'

    put:
      tags:
        - parking-lots
      parameters:
        - name: name
          in: query
          description: Name of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: location
          in: query
          description: Location of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: address
          in: query
          description: Address of the parking lot
          required: true
          schema:
            type: string
            format: string
        - name: capacity
          in: query
          description: total capacity of the parking lot (total amount of parking spots)
          required: true
          schema:
            type: integer
            format: int64
        - name: reserved
          in: query
          description: Reserved parking spots in the parking lot
          required: true
          schema:
            type: integer
            format: int64
        - name: tariff
          in: query
          description: Cost of parking in the parking lot
          required: true
          schema:
            type: number
            format: XXX.XX
        - name: daytariff
          in: query
          description: The max cost of parking for a whole day in the parking lot
          required: true
          schema:
            type: number
            format: XXX.XX
        - name: coordinates
          in: query
          description: Coordinates for the parking lot
          required: true
          schema:
            $ref: '#/components/schemas/coordinates'
      responses:
        '200':
          'description': Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.Modified'
        '401':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          'description': Access denied, Not a ADMIN account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'
        '404':
          'description': Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.LotNotFound'

    delete:
      tags:
        - parking-lots
      responses:
        '200':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parking-lots.deleteLot'
        '401':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          'description': Access denied, Not a ADMIN account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'
        '404':
          'description': Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.LotNotFound'

  /parking-lots/{ParkingLotID}/sessions:
    get:
      tags:
        - parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: ParkingLotID
          in: path
          description: The parking lot ID for which you want to retrieve the current sessions
          required: true
          schema:
            type: string
            format: string
      responses:
#                '200':
#                  description: Operation successful
#                  content:
#                    application/json:
#                      schema:
#                        $ref: '#/components/schemas/parkingLots.sessions.dump'
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          description: Access denied, Not a ADMIN account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'

    delete:
      tags:
        - parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: ParkingLotID
          in: path
          description: The parking lot ID for which you want to retrieve the current sessions
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          'description': Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parking-lots.deleteLot'
        '401':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          'description': '"Access denied, Not a ADMIN account" or "Session ID Required"'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.AccessDenied'
                  - $ref: '#/components/schemas/common.SessionIDRequired'
        '404':
          'description': Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.LotNotFound'

  /parking-lots/{ParkingLotID}/sessions/{SessionID}:
    delete:
      tags:
        - parking-lots
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: ParkingLotID
          in: path
          description: The parking lot ID for which you want to retrieve the current sessions
          required: true
          schema:
            type: string
            format: string
        - name: SessionID
          in: path
          description: The session ID for which you want to delete parking sessions
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          'description': Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.SessionDeleted'
        '401':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          'description': '"Access denied, Not a ADMIN account" or "Session ID Required"'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.AccessDenied'
                  - $ref: '#/components/schemas/common.SessionIDRequired'
        '404':
          'description': Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parkingLots.LotNotFound'

  /reservations:
    post:
      tags:
        - reservations
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.postSucces'
        '401':
          'description': Unauthorized or Missing field
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
                  - $ref: '#/components/schemas/reservation.missingRequireField.licensePlate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.startdate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.enddate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.parkinglot'
                  - $ref: '#/components/schemas/reservation.missingRequireField.user'
        '404':
          'description': Parking lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.parkingLotNotFound'

    put:
      tags:
        - reservations
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.putUpdated'
        '401':
          'description': Unauthorized or Missing field
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
                  - $ref: '#/components/schemas/reservation.missingRequireField.licensePlate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.startdate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.enddate'
                  - $ref: '#/components/schemas/reservation.missingRequireField.parkinglot'
                  - $ref: '#/components/schemas/reservation.missingRequireField.user'
        '404':
          'description': Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.notFound'

  /reservations/{ReservationID}:
    delete:
      tags:
        - reservations
      responses:
        '200':
          description: Operation successful
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/reservation.deleted'
        '401':
          'description': Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          'description': '"Access denied, Not a ADMIN account"'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.AccessDenied'
        '404':
          'description': Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.notFound'
          
    get:
      tags:
        - reservations
      parameters:
        - name: ReservationID
          in: path
          description: ID of reservation from which to return data for
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operation successful
        '401':
          description: Unauthorized or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reservation.notFound'
  
  /vehicles:
    post:
      tags:
        - vehicles
      responses:
  
  /vehicles/:
    post:
      tags:
        - vehicles
      responses:
    put:
      tags:
        - vehicles
      responses:
    delete:
      tags:
        - vehicles
      responses:

  /vehicles/{UserID}:
    get:
      tags:
        - vehicles
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
        - name: UserID
          in: path
          description: UserID for the user from which you want to see all vehicles
          required: true
          schema:
            type: string
            format: string
      responses:
#        '200':
#          description: Operation successful
#          content:
#            application/json:
#              schema:
#                $ref:
        '401':
          description: Unauthorized or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '404':
          description: Not found! / User not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/common.NotFound'
                  - $ref: '#/components/schemas/loginUserNotFound'

  /vehicles/reservations:
    get:
      tags:
        - vehicles
      responses:

  /vehicles/history:
    get:
      tags:
        - vehicles
      responses:
  
  /payments:
