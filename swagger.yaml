          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'
  
  /payments/{UserID}:
    get:
      tags:
        - payments
      parameters:
        - name: UserID
          in: path
          description: ID of user from which to return all payment data
          required: true
          schema:
            type: integer
            format: int64
      responses:

  /billing:
    get:
      tags:
        - billing
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billing'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'

  /billing/{UserID}:
    get:
      tags:
        - billing
      parameters:
        - name: UserID
          in: path
          description: ID of user from which to return all billing information
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billing'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.UnauthorizedInvalidOrMissingToken'
        '403':
          description: Access denied (User is not a ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.AccessDenied'
