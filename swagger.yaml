      tags:
        - payments
      parameters:
        - name: Authorization
          in: header
          description: The authorization token for the user account
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payments'
        '403':
