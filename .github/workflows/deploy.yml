name: CI/CD Pipeline - Build, Test, and Deploy

on:  
  pull_request:
    branches: [ staging ]
  push:
    branches:  [ staging ]
  workflow_dispatch:

jobs:    
  test-and-deploy:
    runs-on: self-hosted
    
    steps:
      # Step 1: Checkout code from staging branch
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref:  staging
          fetch-depth: 0

      # Step 2: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 3: Build all projects
      - name: Build HR.MobyPark (Main API)
        run: dotnet build ./HR.MobyPark/HR.MobyPark.csproj --configuration Release --no-restore

      #DISABLED TO TEST IF THE WORKFLOW WOULD WORK
      # - name: Build HR.MobyPark-SessionWorker
      #   run: dotnet build ./HR.MobyPark-SessionWorker/HR.MobyPark-SessionWorker.csproj --configuration Release --no-restore

      # - name: Build HR.MobyPark-DashboardingDBWorker
      #   run: dotnet build ./HR.MobyPark-DashboardingDBWorker/HR.MobyPark-DashboardingDBWorker.csproj --configuration Release --no-restore

      # - name: Build HR. MobyPark-BillingUsersWorker
      #   run: dotnet build ./HR.MobyPark-BillingUsersWorker/HR.MobyPark-BillingUsersWorker.csproj --configuration Release --no-restore

      # - name: Build HR.MobyPark-UnpaidBillingWorker
      #   run: dotnet build ./HR.MobyPark-UnpaidBillingWorker/HR.MobyPark-UnpaidBillingWorker.csproj --configuration Release --no-restore

      # Step 4: Run MSTest tests (only for HR.MobyPark)
      # - name: Run MSTest tests for HR.MobyPark
      #   run: dotnet test ./HR.MobyPark/HR.MobyPark.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./home/ubuntu-1091749/actions-test-result/
      #   continue-on-error: true

      - name: Create test results directory
        run: mkdir -p ./home/ubuntu-1091749/actions-test-result/

      - name: Run Tests with MSTest
        run: dotnet test --logger "trx;LogFileName=test-results.trx" --results-directory ./home/ubuntu-1091749/actions-test-result/
        continue-on-error: true

      # Step 5: Upload test results and coverage
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:  test-results
          path: |
            ./home/ubuntu-1091749/actions-test-result/
          retention-days: 30

      # Step 6: Parse test results and fail if tests didn't pass
      - name: Check test results
        run: |
          if grep -q "failed=\"0\"" ./home/ubuntu-1091749/actions-test-result/test-results.trx; then
            echo "All tests passed!"
          else
            echo "Tests failed!  Check the artifacts for details."
            exit 1
          fi

      # Step 7: Build Docker images for all services
      - name: Build Docker images with docker-compose
        if: success()
        run: docker-compose build --no-cache

      # Step 8: Stop old containers
      - name: Stop old Docker containers
        if: success()
        run: |
          docker-compose down || true
        continue-on-error: true

      # Step 9: Deploy all services
      - name: Deploy all services
        if: success()
        run: |
          docker-compose up -d
          echo "All services deployed successfully!"
          docker-compose ps

      # Step 10: Push staging to live branch
      - name: Push to live branch
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git push origin staging: live --force

      # Step 11: Notify on failure
      - name: Notify on test failure
        if: failure()
        run: |
          echo "Workflow failed! Check the uploaded artifacts for test results and logs."
