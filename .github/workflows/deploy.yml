name: CI/CD Pipeline - Build, Test, and Deploy

on: 
  pull_request:
    branches: [ staging ]
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs: 
  test-and-deploy:
    # runs-on: HR.MobyPark.Server
    runs-on: self-hosted
    
    steps:
      # Step 1: Checkout code from staging branch
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      # Step 2: Setup .NET
      # This step is not needed since we already have .Net 9 and .Net 10 installed on
      # the server
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: |
      #       9.0.x
      #       10.0.x

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: Build the application
      - name: Build application
        run: dotnet build --configuration Release --no-restore

      # Step 5: Run MSTest tests
      - name: Run MSTest tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./test-results
        continue-on-error: true

      # Step 6: Check test results and upload artifacts if tests fail
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./test-results/
          retention-days: 30

      # Step 7: Parse test results and fail if tests didn't pass
      - name: Check test results
        run: |
          if grep -q "failed=\"0\"" ./test-results/test-results.trx; then
            echo "All tests passed!"
          else
            echo "Tests failed! Check the artifacts for details."
            exit 1
          fi

      # Step 8: Compose Docker image with docker-compose
      - name: Build Docker image with docker-compose
        if: success()
        run: docker-compose build --no-cache mobypark

      # Step 9: Stop old container
      - name: Stop old Docker container
        if: success()
        run: |
          if [ "$(docker ps -q -f name=mobypark)" ]; then
            docker-compose down
          fi
        continue-on-error: true

      # Step 10: Deploy to self-hosted server
      - name: Deploy application to server
        if: success()
        run: |
          docker-compose up -d mobypark
          echo "Application deployed successfully!"

      # Step 11: Push staging to live branch
      - name: Push to live branch
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -d live 2>/dev/null || true
          git push origin staging:live --force
          git log -1 --oneline staging
          git commit --allow-empty -m "Successful deployment to Live environment, This commit is the current version of the program that has been deployed."
          git push origin HEAD:live

      # Step 12: Notify on failure
      - name: Notify on test failure
        if: failure()
        run: |
          echo "Workflow failed! Check the uploaded artifacts for test results and logs."
