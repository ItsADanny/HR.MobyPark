name: .NET

on:
  # Before being allowed to go to the "live" we first have to set our version in the 
  # "staging" branch
  push:
    branches: [ "live" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  build:

    runs-on: self-hosted
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Run code coverage
      run: |
        # Run coverage report
        #coverage xml

        # Report and write to summary.
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

        # Report again and fail if under 100%.
        coverage report --fail-under=100
    - name: Store coverage report
      uses: actions/upload-artifact@v4
      with:
        path: coverage.xml
      if: ${{ failure() }}

    # When the tests are succesful we start building the Docker image (with docker-compose)
    # and deploy the Docker image to our "production" server
    - name: Build Docker image
      run: |
        docker build -t mobypark:latest .
        docker tag mobypark:latest mobypark:${{ github.sha }}
    
    - name: Save Docker image
      run: docker save mobypark:latest | gzip > mobypark-latest.tar.gz
    
    - name: Deploy to remote server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        # Setup trap to ensure SSH key is always cleaned up
        trap 'rm -f ~/.ssh/deploy_key' EXIT
        
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
        
        # Define deployment directory on remote server
        DEPLOY_DIR="/opt/mobypark"
        
        # Copy files to remote server
        scp -i ~/.ssh/deploy_key mobypark-latest.tar.gz docker-compose.yml $SSH_USER@$SSH_HOST:/tmp/
        
        # Deploy on remote server
        ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << EOF
          # Create deployment directory if it doesn't exist
          sudo mkdir -p $DEPLOY_DIR
          sudo chown $SSH_USER:$SSH_USER $DEPLOY_DIR
          
          # Move files to deployment directory
          mv /tmp/docker-compose.yml $DEPLOY_DIR/
          mv /tmp/mobypark-latest.tar.gz $DEPLOY_DIR/
          
          # Change to deployment directory
          cd $DEPLOY_DIR
          
          # Stop and remove old containers
          docker-compose down || true
          docker stop mobypark-app || true
          docker rm mobypark-app || true
          
          # Load new image
          docker load < mobypark-latest.tar.gz
          
          # Start new container
          docker-compose up -d
          
          # Clean up image file
          rm mobypark-latest.tar.gz
          
          # Show status
          docker ps | grep mobypark
        EOF
        
        # Clean up local files
        rm mobypark-latest.tar.gz
