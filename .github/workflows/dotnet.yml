on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'  # Update this condition.
    steps:
      - name: Checkout code
        uses: actions/checkout@v2  
      - name: Build with docker
        run: docker build .
      - name: Deploy
        run: ./deploy.sh
